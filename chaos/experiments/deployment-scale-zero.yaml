apiVersion: chaos.operatorchaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: workbenches-operator-deployment-scale-zero
spec:
  tier: 3
  target:
    operator: workbenches-operator
    component: workbenches-operator
    resource: Deployment/workbenches-operator
  steadyState:
    timeout: "30s"
    checks:
      - type: conditionTrue
        apiVersion: apps/v1
        kind: Deployment
        name: workbenches-operator
        namespace: workbenches-operator-system
        conditionType: Available
  injection:
    type: DeploymentScaleZero
    dangerLevel: high
    parameters:
      name: workbenches-operator
      namespace: workbenches-operator-system
      ttl: "300s"
  hypothesis:
    description: >-
      Scaling the operator deployment to zero replicas removes all operator
      pods. Tests whether the platform detects the unavailable deployment
      and restores it. Without the operator, no reconciliation occurs but
      existing operands continue running.
    recoveryTimeout: 180s
  blastRadius:
    maxPodsAffected: 1
    allowDangerous: true
    allowedNamespaces:
      - workbenches-operator-system
