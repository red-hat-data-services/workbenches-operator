version: "2"

run:
  timeout: 10m

linters:
  default: all
  exclusions:
    rules:
      - linters:
          - lll
        source: "kubebuilder:webhook:|webhook:path="
      - linters:
          - gocognit
          - nestif
        path: _test\.go
  enable:
    - gomodguard_v2
  disable:
    - cyclop
    - depguard
    - gomodguard
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - godox
    - ireturn
    - mnd
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - err113
    - wsl
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-occurrences: 5
      ignore-tests: true
      ignore-string-values:
        - "^(Namespace|ClusterRole|ClusterRoleBinding|CustomResourceDefinition|ConfigMap|Secret|Service|ServiceAccount|Deployment|Role|RoleBinding|MutatingWebhookConfiguration|ValidatingWebhookConfiguration)$"
        - "^rbac\\.authorization\\.k8s\\.io$"
        - "^admissionregistration\\.k8s\\.io$"
        - "^(apiVersion|kind|metadata)$"
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 180
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: dot-imports
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/opendatahub-io/workbenches-operator)
