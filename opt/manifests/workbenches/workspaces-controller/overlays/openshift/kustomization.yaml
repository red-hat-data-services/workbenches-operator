apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeflow-workspaces

resources:
- ../../base
- rbac/tls

components:
- ../../components/prometheus
- ../../components/common

patches:
# Rename and restrict the shared prometheus metrics NP for OpenShift.
- target:
    kind: NetworkPolicy
    name: allow-prometheus-scrape
  path: metrics-networkpolicy-patch.yaml

replacements:
- source:
    kind: Service
    name: workspaces-controller-metrics-service
    fieldPath: metadata.name
  targets:
  - select:
      kind: ServiceMonitor
      name: workspaces-controller-metrics-monitor
    fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: "."
      index: 0
- source:
    kind: Service
    name: workspaces-controller-metrics-service
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: ServiceMonitor
      name: workspaces-controller-metrics-monitor
    fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: "."
      index: 1
