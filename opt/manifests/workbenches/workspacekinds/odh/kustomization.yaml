apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Image refs from notebooks params.env / params-latest.env (same keys as ImageStreams).
# params.env / params-latest.env are copied from notebooks/{odh|rhoai}/base at render
# time (see stageWorkspaceKindImageParams). RELATED_IMAGE_* overrides are applied to
# the notebooks copies before workspacekinds renders.

resources:
- jupyterlab_v1beta1_workspacekind.yaml
- codeserver_v1beta1_workspacekind.yaml

configMapGenerator:
- envs:
  - params.env
  - params-latest.env
  name: workspacekind-image-params

generatorOptions:
  disableNameSuffixHash: true

replacements:
- source:
    fieldPath: data.odh-workbench-jupyter-minimal-cpu-py312-ubi9-n
    kind: ConfigMap
    name: workspacekind-image-params
    version: v1
  targets:
  - fieldPaths:
    - spec.podTemplate.options.imageConfig.values.0.spec.image
    select:
      group: kubeflow.org
      kind: WorkspaceKind
      name: jupyterlab
      version: v1beta1
- source:
    fieldPath: data.odh-workbench-jupyter-minimal-cpu-py312-ubi9-3-5
