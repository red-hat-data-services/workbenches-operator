## Deployable JupyterLab WorkspaceKind for Open Data Hub.
##
## imageConfig values map to OpenShift ImageStreams from
## workbenches-operator/opt/manifests/workbenches/notebooks/odh/base
## (jupyter workbench ImageStreams only; runtime ImageStreams are omitted).
##
## Image refs are injected at deploy time from notebooks params.env / params-latest.env
## (RELATED_IMAGE_* when set, otherwise bundled fallback digests/tags).

apiVersion: kubeflow.org/v1beta1
kind: WorkspaceKind
metadata:
  name: jupyterlab
  labels:
    app.opendatahub.io/name: workbenches
    app.opendatahub.io/component: workspaces-controller
    opendatahub.io/platform: "odh"
spec:
  spawner:
    displayName: "JupyterLab Notebook"
    description: "A Workspace which runs JupyterLab in a Pod using Open Data Hub workbench images"
    hidden: false
    deprecated: false
    icon:
      url: "https://jupyter.org/assets/favicons/apple-touch-icon-152x152.png"
    logo:
      url: "https://upload.wikimedia.org/wikipedia/commons/3/38/Jupyter_logo.svg"

  filterRules:
    ## hide CUDA images in namespaces that do not advertise NVIDIA GPUs
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
      match:
        - matchNamespace:
            selector:
              matchExpressions:
                - key: "nvidia.com/gpu"
                  operator: DoesNotExist
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: "cuda_version"
                  operator: Exists
    ## hide ROCm images in namespaces that do not advertise AMD GPUs
    - scope: IMAGE_CONFIG
      effect:
        ui:
          hide: true
      match:
        - matchNamespace:
            selector:
              matchExpressions:
                - key: "amd.com/gpu"
                  operator: DoesNotExist
        - matchImageConfig:
            selector:
              matchExpressions:
                - key: "rocm_version"
                  operator: Exists
    ## hide NVIDIA GPU pod configs in namespaces that do not advertise NVIDIA GPUs
    - scope: POD_CONFIG
      effect:
        ui:
          hide: true
      match:
        - matchNamespace:
            selector:
              matchExpressions:
                - key: "nvidia.com/gpu"
                  operator: DoesNotExist
        - matchPodConfig:
            selector:
              matchLabels:
                gpu_vendor: nvidia

  activityRules:
    - config:
        secondsSinceActive: 7200
        minRunningSeconds: 300
      match: {}
      effect:
        pauseWorkspace: true

  podTemplate:
    podMetadata:
      labels: {}
      annotations: {}
    activityProbe:
      minProbeIntervalSeconds: 300
      probeIntervalSeconds: 3600
      jupyter:
        lastActivity: true
        portId: "jupyterlab"
    probes: {}
    volumeMounts:
      ## ODH/RHOAI UBI workbench images use /opt/app-root/src as the user home
      home: "/opt/app-root/src"
    ports:
      - id: "jupyterlab"
        defaultDisplayName: "JupyterLab"
        protocol: "HTTP"
        httpProxy:
          removePathPrefix: false
          requestHeaders: {}
    extraEnv:
      - name: "NB_PREFIX"
        value: |-
          {{ httpPathPrefix "jupyterlab" }}
      ## Jupyter auth is disabled in-container; access is restricted to authenticated
      ## gateway-only ingress (kube-rbac-proxy / Workspace gateway). Direct Pod ingress
      ## is not exposed to users.
      - name: "NOTEBOOK_ARGS"
        value: |-
          --ServerApp.port=8888 --ServerApp.token='' --ServerApp.password='' --ServerApp.base_url={{ httpPathPrefix "jupyterlab" }} --ServerApp.quit_button=False
    extraVolumeMounts:
      - name: "dshm"
        mountPath: "/dev/shm"
    extraVolumes:
      - name: "dshm"
        emptyDir:
          medium: "Memory"
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    options:
      imageConfig:
        spawner:
          default: "jupyter-minimal-notebook:3.6"
        values:
          ## Jupyter | Minimal | CPU | Python 3.12 (3.6)
          ## ImageStream jupyter-minimal-notebook:3.6
          - id: "jupyter-minimal-notebook:3.6"
            spawner:
              displayName: "Jupyter | Minimal | CPU | Python 3.12 (3.6)"
              description: "Jupyter notebook image with minimal dependency set to start experimenting with Jupyter environment."
              labels:
                - key: "python_version"
                  value: "v3.12"
            spec:
              image: "odh-workbench-jupyter-minimal-cpu-py312-ubi9-n_PLACEHOLDER"
              imagePullPolicy: "Always"
              ports:
                - id: "jupyterlab"
                  port: 8888

          ## Jupyter | Minimal | CPU | Python 3.12 (3.5)
          ## ImageStream jupyter-minimal-notebook:3.5
          - id: "jupyter-minimal-notebook:3.5"
            spawner:
              displayName: "Jupyter | Minimal | CPU | Python 3.12 (3.5)"
              description: "Jupyter notebook image with minimal dependency set to start experimenting with Jupyter environment."
              labels:
                - key: "python_version"
                  value: "v3.12"
            redirect:
              to: "jupyter-minimal-notebook:3.6"
              message:
                level: "Info"
                text: >
                  A newer version of this workbench image is available.
                  Update to jupyter-minimal-notebook:3.6 when convenient.
            spec:
              image: "odh-workbench-jupyter-minimal-cpu-py312-ubi9-3-5_PLACEHOLDER"
              imagePullPolicy: "Always"
              ports:
                - id: "jupyterlab"
                  port: 8888

          ## Jupyter | Minimal | CUDA | Python 3.12 (3.6)
          ## ImageStream jupyter-minimal-gpu-notebook:3.6
          - id: "jupyter-minimal-gpu-notebook:3.6"
            spawner:
              displayName: "Jupyter | Minimal | CUDA | Python 3.12 (3.6)"
              description: "Jupyter notebook image with GPU support and minimal dependency set to start experimenting with Jupyter environment."
              labels:
                - key: "cuda_version"
                  value: "13.0"
                - key: "python_version"
                  value: "v3.12"
            spec:
              image: "odh-workbench-jupyter-minimal-cuda-py312-ubi9-n_PLACEHOLDER"
