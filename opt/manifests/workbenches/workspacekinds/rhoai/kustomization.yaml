apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Image refs from notebooks params.env / params-latest.env (same keys as ImageStreams).
# params.env / params-latest.env are copied from notebooks/{odh|rhoai}/base at render
# time (see stageWorkspaceKindImageParams). RELATED_IMAGE_* overrides are applied to
# the notebooks copies before workspacekinds renders.

resources:
- jupyterlab_v1beta1_workspacekind.yaml
- codeserver_v1beta1_workspacekind.yaml

configMapGenerator:
- envs:
  - params.env
  - params-latest.env
  name: workspacekind-image-params

generatorOptions:
  disableNameSuffixHash: true

