name: TLS Config Lint
on:
  pull_request:
    branches: [main, master, dev, odh, incubating, stable-2.x]

permissions:
  contents: read
  security-events: write

jobs:
  tls-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: sebrandon1/tls-config-lint@8ab3080f289b58d6c0d1211402a75e1316349f5d # v1
        id: lint
        with:
          severity-threshold: high
          sarif-output: tls-lint.sarif
          exclude-dirs: vendor,node_modules,test/fixtures

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always()
        with:
          sarif_file: tls-lint.sarif
