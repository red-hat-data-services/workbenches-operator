name: E2E Tests

on:
  push:
    branches: [main, stable, v1.x]
    paths:
      - "cmd/**"
      - "api/**"
      - "internal/**"
      - "Dockerfile"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "config/**"
      - "charts/**"
      - "tests/e2e/**"
      - "tests/kind/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, stable, v1.x]
    paths:
      - "cmd/**"
      - "api/**"
      - "internal/**"
      - "Dockerfile"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "config/**"
      - "charts/**"
      - "tests/e2e/**"
      - "tests/kind/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    name: E2E Tests (${{ matrix.deploy-method }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        deploy-method: [kustomize, helm]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_instances=1024

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: workbenches-e2e
          node_image: kindest/node:v1.32.0

      - name: Fetch upstream manifests
        env:
          ODH_PLATFORM_TYPE: OpenDataHub
        run: make manifests-fetch

      - name: Install Kind prerequisites
        run: bash tests/kind/bootstrap.sh

      - name: Build operator image
        run: |
          make image-build IMG=workbenches-operator:e2e CONTAINER_ENGINE=docker
          kind load docker-image workbenches-operator:e2e --name workbenches-e2e

      # --- kustomize deploy path ---

      - name: Install CRDs (kustomize)
        if: matrix.deploy-method == 'kustomize'
        run: |
          make kustomize controller-gen
          for attempt in 1 2 3; do
            make install && exit 0
            if [[ "${attempt}" -lt 3 ]]; then
              echo "make install failed (attempt ${attempt}/3), retrying..."
              sleep 15
            else
              echo "make install failed after 3 attempts"
            fi
          done
          exit 1

      - name: Deploy operator with webhooks (kustomize)
        if: matrix.deploy-method == 'kustomize'
        run: |
          make kustomize
          (cd config/manager && ../../bin/kustomize edit set image controller=workbenches-operator:e2e)
          bin/kustomize build config/certmanager | kubectl apply -f -
          kubectl patch -n workbenches-operator-system \
            deployment/workbenches-operator \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"manager","imagePullPolicy":"Never"}]}}}}'

      # --- helm deploy path ---

      - name: Create applications namespace (helm)
        if: matrix.deploy-method == 'helm'
        # The Helm chart creates odh-workbenches-config in the resolved applications
        # namespace (applicationsNamespace, or operatorNamespace when unset). Standalone
        # Makefile sets APPLICATIONS_NAMESPACE=opendatahub while the operator Deployment
        # stays in workbenches-operator-system. In production, opendatahub-operator
        # sets a single operatorNamespace=ApplicationsNamespace for both.
        run: kubectl create namespace opendatahub

      - name: Deploy operator with webhooks (helm)
        if: matrix.deploy-method == 'helm'
        # Append extras; do not replace HELM_DEPLOY_SETS or applicationsNamespace
        # falls back to operatorNamespace (workbenches-operator-system) and e2e
        # expectations for opendatahub break.
        run: |
          make helm-deploy \
            IMG=workbenches-operator:e2e \
            HELM_DEPLOY_EXTRA_SETS="--set webhooks.tlsProvider=certmanager \
              --set image.pullPolicy=Never"

      # --- shared post-deploy steps ---

      - name: Wait for operator ready
        run: |
          kubectl wait --for=condition=Available --timeout=120s \
            deployment/workbenches-operator \
            -n workbenches-operator-system

      - name: Run E2E tests
        run: make test-e2e
        env:
          OPERATOR_NAMESPACE: workbenches-operator-system

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          echo "=== Operator logs ==="
          kubectl logs -n workbenches-operator-system \
            deployment/workbenches-operator \
            --tail=500 2>&1 | tee /tmp/e2e-logs/operator.log || true
          echo "=== Workbenches CR ==="
          kubectl get workbenches -o yaml 2>&1 | tee /tmp/e2e-logs/workbenches.yaml || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' 2>&1 \
            | tail -50 | tee /tmp/e2e-logs/events.log || true
          echo "=== Pods ==="
          kubectl get pods -A 2>&1 | tee /tmp/e2e-logs/pods.log || true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-logs-${{ matrix.deploy-method }}
          path: /tmp/e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
